[package]
name = "tasklens"
version = "0.1.0"
description = "Turn information into action. Privately."
authors = ["TaskLens contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-single-instance = "2"
cpal = "0.15.3"
hound = "3.5"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
