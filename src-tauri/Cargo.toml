[package]
name = "tasklens"
version = "0.1.0"
description = "Turn information into action. Privately."
authors = ["TaskLens contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

tauri-plugin-single-instance = "2"
cpal = "0.15.3"
hound = "3.5"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"
tokio = { version = "1", features = ["time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zeroize = "1"
tempfile = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "=4.18.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["UI_Notifications"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
block2 = "=0.6.2"
block = "0.1"

# Keep streaming integrity verification practical in development builds. Inference sidecars
# are separately built Release binaries; this changes neither their settings nor model data.
[profile.dev.package.sha2]
opt-level = 3
