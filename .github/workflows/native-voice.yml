name: Desktop validation and candidate packaging
# Fast checks (types, lint, unit, browser, audits, secret scan) live in quality.yml only.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package*.json'
      - '.node-version'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-voice.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Build all offline installer candidates (requires Windows packaging variables)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: 2
  TASKLENS_BUILD_JOBS: 2
jobs:
  native-assets:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/tessdata
            .local-ai/downloads
          key: offline-assets-${{ hashFiles('src-tauri/resources/models.json') }}
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture')"
      - run: npm ci
      - run: npm run prepare:models
      - run: npm run build:runtimes
      - run: npm run prepare:notices
      - run: npm run verify:assets
      # tar preserves sidecar executable modes across Actions artifact transport.
      - run: tar -cf native-assets.tar src-tauri/binaries src-tauri/resources/models src-tauri/resources/tessdata src-tauri/resources/notices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-assets-${{ matrix.os }}
          path: native-assets.tar
          compression-level: 0
          retention-days: 3
  rust:
    timeout-minutes: 60
    needs: native-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-assets-${{ matrix.os }}
          path: ${{ runner.temp }}/native
      - run: tar -xf "$RUNNER_TEMP/native/native-assets.tar" && rm "$RUNNER_TEMP/native/native-assets.tar"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  packaging:
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: [rust, native-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture')"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-assets-${{ matrix.os }}
          path: ${{ runner.temp }}/native
      - run: tar -xf "$RUNNER_TEMP/native/native-assets.tar" && rm "$RUNNER_TEMP/native/native-assets.tar"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          TASKLENS_WEBVIEW2_URL: ${{ vars.TASKLENS_WEBVIEW2_URL }}
          TASKLENS_WEBVIEW2_SHA256: ${{ vars.TASKLENS_WEBVIEW2_SHA256 }}
          TASKLENS_INNO_URL: ${{ vars.TASKLENS_INNO_URL }}
          TASKLENS_INNO_SHA256: ${{ vars.TASKLENS_INNO_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($kind in @('WEBVIEW2', 'INNO')) {
            $url = [Environment]::GetEnvironmentVariable("TASKLENS_${kind}_URL")
            $hash = [Environment]::GetEnvironmentVariable("TASKLENS_${kind}_SHA256")
            if (-not $url -or -not $url.StartsWith('https://') -or $hash -notmatch '^[a-fA-F0-9]{64}$') { throw "BLOCKED: configure verified $kind URL and SHA256 variables" }
            $file = Join-Path $env:RUNNER_TEMP "$kind.exe"
            Invoke-WebRequest -Uri $url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $hash) { throw "$kind checksum mismatch" }
          }
          & ./scripts/verify-webview2.ps1 -Path "$env:RUNNER_TEMP/WEBVIEW2.exe"
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP/INNO.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP/Inno" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "TASKLENS_WEBVIEW2_INSTALLER=$env:RUNNER_TEMP/WEBVIEW2.exe" >> $env:GITHUB_ENV
          "TASKLENS_WEBVIEW2_SHA256=$env:TASKLENS_WEBVIEW2_SHA256" >> $env:GITHUB_ENV
          "TASKLENS_ISCC=$env:RUNNER_TEMP/Inno/ISCC.exe" >> $env:GITHUB_ENV
      - name: Check large-payload packaging disk budget
        run: |
          node -e "const fs=require('node:fs');const s=fs.statfsSync('.');if(s.bavail*s.bsize<32*1024**3)throw new Error('BLOCKED: offline multi-installer packaging needs at least 32 GiB free workspace; use an adequately sized runner')"
      - run: npm run release:desktop -- --prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.os }}
          path: src-tauri/target/release/distribution/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  artifact-verification:
    timeout-minutes: 60
    needs: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - run: |
          for directory in "$RUNNER_TEMP"/candidates/candidate-*; do
            node scripts/release-artifacts.mjs "$directory"
          done
      # Publication is deliberately separate; follow RELEASE_CHECKLIST.md and docs/RELEASING.md.
