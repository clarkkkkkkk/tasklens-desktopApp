name: Offline desktop builds
on:
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', 'src/services/**', 'src/features/**', 'scripts/**', 'package*.json', '.github/workflows/native-voice.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      TASKLENS_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/tessdata
            .local-ai/downloads
          key: offline-assets-${{ hashFiles('src-tauri/resources/models.json') }}
      - run: npm ci
      - run: npm run prepare:models
      - run: npm run build:runtimes
      - run: npm run prepare:notices
      - run: npm run verify:assets
      - run: npm run check
      - run: npm test
      - run: npm run test:assets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles rpm,appimage
      - if: runner.os == 'macOS'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg
      - if: runner.os == 'Windows'
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle
      # Full Windows installer requires a verified offline WebView2 installer and Inno Setup
      # 6.5.2+, as documented in LOCAL_AI.md. This job validates native application staging.
      - uses: actions/upload-artifact@v4
        with:
          name: TaskLens-offline-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/${{ matrix.target }}/release/tasklens.exe
            src-tauri/target/${{ matrix.target }}/release/tasklens-*.exe
            src-tauri/target/${{ matrix.target }}/release/resources/
            src-tauri/resources/notices/runtime-build.json
          if-no-files-found: error
